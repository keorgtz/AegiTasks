<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6fb" />
    <meta
      name="description"
      content="Reporta, organiza y resuelve los pendientes de tu equipo con AegiTasks."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/aegitasks-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/aegitasks-favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/aegitasks-apple-touch-icon.png" />
    <title>AegiTasks · Tu equipo, en sintonía</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('aegitasks-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
